# Release: a tag v<version> builds the package, checks it, publishes it to PyPI by Trusted Publishing (OIDC, no
# stored token), then publishes server.json to the MCP Registry as io.github.Miles-Medical-Service/npreq, proven by
# this workflow's GitHub OIDC token (no key held anywhere). Both publish jobs wait for a person to approve the "pypi"
# environment. See RELEASING.md.
# Every action is pinned to a full commit SHA (the tag it was is in the comment); Dependabot proposes updates.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
      - name: The tag, pyproject, server.json and the server agree on the version
        env:
          TAG: ${{ github.ref_name }}
        run: python3 tools/check_release.py "$TAG"
      - name: Tests
        run: python3 tests/test_npreq_mcp.py
      - name: Build the sdist and the wheel
        run: |
          python3 -m pip install build==1.6.1
          python3 -m build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/npreq-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  publish-registry:
    needs: publish-pypi
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_URL: https://github.com/modelcontextprotocol/registry/releases/download/v1.8.7/mcp-publisher_linux_amd64.tar.gz
      MCP_PUBLISHER_SHA256: 00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: mcp-publisher v1.8.7, checked against its release digest
        run: |
          curl -fsSL --proto '=https' -o "$RUNNER_TEMP/mcp-publisher.tar.gz" "$MCP_PUBLISHER_URL"
          echo "$MCP_PUBLISHER_SHA256  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
      - name: Publish server.json (GitHub OIDC proves the io.github.Miles-Medical-Service namespace)
        run: |
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          for attempt in 1 2 3 4 5; do
            "$RUNNER_TEMP/mcp-publisher" publish && exit 0
            echo "registry publish attempt $attempt failed; PyPI may not show the new version yet"
            sleep 60
          done
          exit 1
